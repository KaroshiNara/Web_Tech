<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="keywords" content="Self, Created, webpage">
    <meta name="description" content="The website is created by me.">
    <meta name="author" content="Karoshi Nara">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My HTML Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      .btn-custom-style{
        --bs-btn-padding-y: 0.17rem;
        --bs-btn-padding-x: 1.20rem;
        --bs-btn-font-size: 0.85rem;
        margin-left: 1%;
      }
    </style>
  </head>
  <body style="width:90%; margin:auto;">
    <!-- Top Nav Bar Div is here -->
    <div style=" background-color: #ffffff; margin-top: 1%;">
      <!-- All 4 buttons div is here -->
      <div style="position:absolute; left:5%; width:40%;">
        <button type="button" class="btn btn-warning btn-custom-style">Flipkart</button>
        <button type="button" class="btn btn-light btn-custom-style" style="background-color: #ff0000; border-color: #ff0000;">Minutes</button>
        <button type="button" class="btn btn-secondary btn-custom-style" style="background-color: #0088ff; border-color: #0088ff;">Travel</button>
        <button type="button" class="btn btn-secondary btn-custom-style" style="background-color: #22ff00; border-color: #22ff00;">Grocery</button>
      </div>
      <!-- The supercoin and address div is here -->
      <div style="position:absolute; right:5%; justify-content: center; display: flex; align-items: center; background-color: #fff200; border-radius: 12px; padding-left: 5px; padding-right: 5px; height: 30px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="10" fill="#FFCC00"/>
          <path d="M3.8 10.8L11 2L9.39997 8.4L15 8.4L8.6 18L10.2 10.8L3.8 10.8Z" fill="white" stroke-linejoin="round" stroke="white"/>
        </svg>
        <p style="margin-left: 5px; margin-top: 13px; color: #000000;">SuperCoin</p>
        
      </div>
    </div>
    
    <!--Java Script of Bootstrap is Here--------------------------------->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
